[LightDM]
run-directory=/run/lightdm
log-directory=/var/log/lightdm
[Seat:*]
xserver-command=X -nolisten tcp -s 0 -dpms
xserver-allow-tcp=false
user-session=kebab-panel
autologin-user=debian
autologin-user-timeout=0
autologin-session=kebab-panel
session-wrapper=/usr/local/libexec/kebab-panel-session
allow-guest=false
allow-user-switching=false
exit-on-failure=true
[XDMCPServer]
enabled=false
[VNCServer]
enabled=false
