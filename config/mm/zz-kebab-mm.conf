# kebab: start ModemManager only after the SDX55 bring-up unit has run.
#
# MM run too early marks the QRTR port invalid after its probe timeouts and
# never looks again (observed by the Apollo project and consistent with this
# board: the modem needs ~9 s of Sahara before QMI answers).
#
# Deliberately NOT adding --test-multiplex-requested: kebab's kernel has no
# CONFIG_RMNET and mainline mhi_net is raw-IP only, so a multiplexing request
# could not produce a mux netdev. See docs/sdx55-modemmanager-20261112.md §0.5.
[Unit]
After=kebab-sdx55-modem.service
Wants=kebab-sdx55-modem.service
