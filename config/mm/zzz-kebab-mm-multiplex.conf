# ModemManager drop-in: request QMAP multiplexing for every new bearer.
#
# THIS IS NOT INSTALLED BY DEFAULT.  It is the "raw-IP wedged, now what" lever,
# the one the community lists as missing on kebab
# (jfbobier/kebab-pmos docs/research/MODEM.md: "zz-apollo-multiplex.conf --
# without QMAP multiplexing the downlink wedges permanently after ~10 MB").
#
# Why it is not the default:
#   * raw-IP needs no kernel module; this path needs `rmnet` loaded,
#   * it changes the on-wire encapsulation to QMAP (the modem stops sending
#     bare IP), so the two sides must agree - never enable it and then run
#     `kebab-qmi-wds.py data-up` without --mux,
#   * with no SIM card none of it can be exercised here.
#
# Enable ONLY after raw-IP has been proven to wedge:
#
#   sudo kebab-modem-qmap load          # rmnet.ko first, or MM fails later
#   sudo install -m 644 \
#        /usr/local/lib/kebab-mm/dropins/zzz-kebab-mm-multiplex.conf \
#        /etc/systemd/system/ModemManager.service.d/
#   sudo systemctl daemon-reload && sudo systemctl restart ModemManager
#
# Disable: rm that file, daemon-reload, restart.  Restore the WDA format with
#   python3 /usr/local/lib/kebab-modem/kebab-qmi-wds.py format-set \
#       --ul disabled --dl disabled --apply
#
# Note: the ExecStart below repeats the whole command line on purpose.  Drop-in
# files are applied in filename order, and "zzz-..." sorts after
# zz-kebab-mm-patched.conf (which sets the patched binary); repeating ExecStart
# here is what makes the extra flag survive.
#
# (The first version of this file was named zz-kebab-mm-multiplex.conf, which
# sorts BEFORE zz-kebab-mm-patched.conf - the flag was silently dropped and
# "systemctl show -p ExecStart" still showed the plain command line.  Verified
# the hard way.)
[Service]
ExecStart=
ExecStart=/usr/local/lib/kebab-mm/ModemManager-patched --log-journal --test-multiplex-requested
