# OnePlus 8T (kebab) -- UCM2 entry in the path alsa-lib actually probes for a
# real card: ucm2/conf.d/<CardDriver>/<CardLongName>.conf
# (see /usr/share/alsa/ucm2/ucm.conf, If.V2ConfD). The card reports driver
# "sm8250" and longname "OnePlus 8T".
Syntax 3

SectionUseCase."HiFi" {
	File "/conf.d/sm8250/HiFi.conf"
	Comment "Play HiFi quality Music"
}
