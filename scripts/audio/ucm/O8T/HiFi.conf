# OnePlus 8T (kebab) HiFi profile -- staged private UCM2.
#
# alsa-lib resolves the control device for a device sequence from the
# PlaybackCTL / CaptureCTL values, not from PlaybackPCM/CapturePCM: with both
# unset it errors out at the first cset with "cdev is not defined" (main.c:819).
# A real audio server passes its own card handle, but alsaucm standalone does
# not, so the values have to be spelled out here. Both must name the same card.
#
# The controls below are exactly the ones audited from the live card in run
# 20261112t1115z. Nothing else is touched: no volume, no DEC0 mux, no gain.

SectionVerb {
	Value {
		PlaybackCTL "hw:0"
		CaptureCTL  "hw:0"
	}
}

SectionDevice."Speaker" {
	Comment "Tertiary MI2S -> TFA9874 pair (Left ch0 / Right ch1)"

	EnableSequence [
		cset "name='TERT_MI2S_RX Audio Mixer MultiMedia1' on"
	]

	DisableSequence [
		cset "name='TERT_MI2S_RX Audio Mixer MultiMedia1' off"
	]

	Value {
		PlaybackCTL "hw:0"
		PlaybackPCM "hw:0"
		PlaybackPriority 100
	}
}

SectionDevice."Mic" {
	Comment "VA-DMIC0/1 through VA_CODEC_DMA_TX_0"

	EnableSequence [
		cset "name='MultiMedia2 Mixer VA_CODEC_DMA_TX_0' on"
		cset "name='VA_AIF1_CAP Mixer DEC0' on"
		cset "name='VA DMIC MUX0' 2"
	]

	DisableSequence [
		cset "name='VA DMIC MUX0' 0"
		cset "name='VA_AIF1_CAP Mixer DEC0' off"
		cset "name='MultiMedia2 Mixer VA_CODEC_DMA_TX_0' off"
	]

	Value {
		CaptureCTL "hw:0"
		CapturePCM "hw:0"
		CapturePriority 100
	}
}
