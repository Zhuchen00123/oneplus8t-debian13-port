# OnePlus 8T (kebab) -- entry point for the name alsa-lib derives from the card
# longname. PipeWire/WirePlumber (ACP) opens UCM by snd_card_get_name(), which is
# "OnePlus 8T", not the card id "O8T"; without this directory the card falls back
# to the generic pro-audio profile and never gets a sink.
Syntax 3

SectionUseCase."HiFi" {
	File "/OnePlus 8T/HiFi.conf"
	Comment "Play HiFi quality Music"
}
